<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hustle — Trusted local services, booked in minutes</title>
    <meta name="description" content="Hustle connects you with verified, background-checked service providers near you in South Africa. Cleaning, beauty, repairs, tutoring, events and more — book and pay securely in minutes." />
    <meta name="author" content="Capvtal Innovations" />
    <meta name="application-name" content="Hustle" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://hustle.capvtal.com/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hustle" />

    <meta property="og:site_name" content="Hustle" />
    <meta property="og:title" content="Hustle — Trusted local services, booked in minutes" />
    <meta property="og:description" content="Verified local hustlers for cleaning, beauty, repairs, tutoring, events and more. Book and pay securely." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hustle.capvtal.com/" />
    <meta property="og:image" content="https://hustle.capvtal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_ZA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hustle — Trusted local services, booked in minutes" />
    <meta name="twitter:description" content="Verified local hustlers for cleaning, beauty, repairs, tutoring, events and more." />
    <meta name="twitter:image" content="https://hustle.capvtal.com/og-image.png" />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Hustle",
        "url": "https://hustle.capvtal.com",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "areaServed": "ZA",
        "publisher": { "@type": "Organization", "name": "Capvtal Innovations", "url": "https://capvtal.com" }
      }
    </script>
    <script>
      try {
        var t = localStorage.getItem("hustle-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>Hustle needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
